name: 전략기획팀 - 주간 시스템 감사

on:
  schedule:
    - cron: '0 0 * * 1'    # UTC 00:00 (월) = KST 09:00 (월)
  workflow_dispatch:

concurrency:
  group: strategy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 전략기획팀 실행
        run: node agents/strategy.js
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          CAFE24_API_URL:      ${{ secrets.CAFE24_API_URL }}
          CAFE24_API_KEY:      ${{ secrets.CAFE24_API_KEY }}
          SMTP_HOST:           ${{ secrets.SMTP_HOST }}
          SMTP_PORT:           ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:         ${{ secrets.SMTP_SECURE }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASS:           ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME:     ${{ secrets.EMAIL_FROM_NAME }}
          JBLOGZY_API_URL:     ${{ secrets.JBLOGZY_API_URL }}
          JBLOGZY_API_KEY:     ${{ secrets.JBLOGZY_API_KEY }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
