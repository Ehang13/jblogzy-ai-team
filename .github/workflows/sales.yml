name: 영업팀 - 리드 발굴

on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 KST
    - cron: '0 3 * * *'    # 12:00 KST
    - cron: '0 7 * * *'    # 16:00 KST
    - cron: '0 11 * * *'   # 20:00 KST
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: 영업팀 실행
        run: node agents/sales.js
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          CAFE24_API_URL:     ${{ secrets.CAFE24_API_URL }}
          CAFE24_API_KEY:     ${{ secrets.CAFE24_API_KEY }}
          NAVER_CLIENT_ID:    ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          JBLOGZY_API_URL:    ${{ secrets.JBLOGZY_API_URL }}
          JBLOGZY_API_KEY:    ${{ secrets.JBLOGZY_API_KEY }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_SECURE:        ${{ secrets.SMTP_SECURE }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASS:          ${{ secrets.SMTP_PASS }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME:    ${{ secrets.EMAIL_FROM_NAME }}
